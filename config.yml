input: jnicx.jar
output: jnicx-jnt.jar

compiler:
  os: windows
  arch: x86_64
  version: 0.15.2

zig:
  os: windows
  arch: x86_64
  version: 0.15.2
  installation: zig

targets:
  - x86_64-windows
  #- x86_64-linux

debug:
  compilation:
    - x86_64-windows
    #- x86_64-linux

fingerprint: false

jnt-path: war/jnt
mutators:
  metaphor:
    order:
      - renamer.method
    #  - renamer.class
      - renamer.field
      - renamer.desc
   #   - ref
      - mutilate-return
      - splash-screen
      - access-unify
      - dot-graph
      - inlining
      - field-initialize
      - lift-constructors
      - internal-class-integrator
      - unused-method-remover
      - unused-class-remover
      #      - main-call-check
      #      - method-integrity
      - string.light  #working
    #  - string.poly
    #  - string.poly2  #working
      - flow.break
      - flow.traps
      - flow.flattening
      - flow.shuffle
      - flow.switch
    #  - flow.opaque
      - number.salt
      - number.table
      - call-graph
      - watermark
      - strip
      - optimizer
      - dot-graph
      - array-rewriter
      - indy-rewriter
    transformers:
      mutilate-return:
        enabled: true

      splash-screen:
        enabled: false

      optimizer:
        enabled: false

      inlining:
        enabled: false
        debug: false
        iterate: false
        skip-transpiled-checks: false

      field-initialize:
        enabled: true

      access-unify:
        enabled: true
        exploit: false

      unused-method-remover:
        enabled: false
      unused-class-remover:
        enabled: false

      renamer:
        method:
          enabled: true
        field:
          enabled: true
        desc:
          enabled: true
        class:
          enabled: false

      main-call-check:
        entry: 'dev/xyz/entrypoint/EntrypointKt'
        enabled: false

      call-graph:
        enabled: true

      method-integrity:
        enabled: false

      string:
        poly:
          enabled: false
        poly2:
          enabled: false
        light:
          enabled: true

      ref:
        enabled: false
      flow:
        shuffle:
          enabled: false
        break:
          enabled: false
        traps:
          enabled: true
        flattening:
          enabled: true
        switch:
          enabled: true
        opaque:
          enabled: false

      number:
        salt:
          enabled: true
          level: HIGH
          skipBsm: true
        table:
          enabled: true

      lift-constructors:
        enabled: false

      strip:
        enabled: true

      watermark:
        enabled: true

      array-rewriter:
        enabled: true
      indy-rewriter:
        enabled: true

      dot-graph:
        enabled: false

      exchange:
        enabled: true

      method-call-fix:
        enabled: false
  jnt:
    order:
      - cleanup
      - integrate
    transformers:
      cleanup:
        enabled: true
      integrate:
        enabled: true

    virtualize:
      enabled: true
      chance: 100

    intrinsic: false

    traceless: true

input: jnicx.jar
output: jnicx-native.jar

compiler:
  os: linux
  arch: aarch64
  version: 1.0

zig:
  os: windows
  arch: x86_64
  version: 0.14.1
  installation: zig

targets:
 #- x86_64-windows
 #- x86_64-linux
  - aarch64-linux

debug:
  compilation:
    - x86_64-windows
    #- x86_64-linux

fingerprint: false

exempt:
  - package: me/exeos/jnicx/jnic/decompress
    classes:
      - class: LZMADecoder
        methods:
          - "*"

jnt-path: dev/ark
mutators:
  metaphor:
    order:
    #  - anti-debug
    #  - anti-dump
      - renamer.class
      - renamer.method
      - renamer.field
      - renamer.localvariable
      - renamer.desc
      - call-graph
      - splash-screen
      - access-unify
      - dot-graph
    #  - inlining
      - field-initialize
      - lift-constructors
      - internal-class-integrator
      - unused-method-remover
      - unused-class-remover
      #      - main-call-check
      #      - method-integrity
      - string.stack
      - string.split
      - string.light  #working
    #  - string.poly
    #  - string.poly2  #working
    #  - ahegao  ## not wrorking  
    # - flow.break
      - flow.break
      - flow.shuffle
      - flow.traps
      - flow.flattening
    #  - flow.opaque 
      - flow.switch
      - numberobf
      - number.salt
      - number.table
      - mba
      - dead-code
      - method-split
    #  - virtualize
    #  - ref
      - var-duplicate
      - mutilate-return
      - watermark
    #  - anti-tamper
      - strip
      - optimizer
      - dot-graph
      - array-rewriter
      - indy-rewriter
      - member-shuffle
    #  - runtime-patch
    transformers:
      mutilate-return:
        enabled: true

      splash-screen:
        enabled: false

      optimizer:
        enabled: false

      inlining:
        enabled: false
        debug: false
        iterate: false
        skip-transpiled-checks: false

      field-initialize:
        enabled: true

      access-unify:
        enabled: true
        exploit: false

      unused-method-remover:
        enabled: false
      unused-class-remover:
        enabled: false
#-----------------------------
      renamer:
        class:
          enabled: true
          dictionary: illusion   # mode
          length: 10             # base length (longer = harder to brute-force collisions)
          prefix: ""             # optional fixed prefix

        method:
          enabled: true
          dictionary: unicode
          length: 6

        field:
          enabled: true
          dictionary: alpha
          length: 4
          prefix: "f"            # e.g. all field names start with f

        localvariable:
          enabled: true
          dictionary: unicode   # illusion/alpha/keyword/counter/random
          length: 5
          prefix: ""
          skip-this: true       # false = rename 'this' too (maximum aggression)
#-------------------------------
      main-call-check:
        entry: 'dev/xyz/entrypoint/EntrypointKt'
        enabled: false

      call-graph:
        enabled: true
#--------------------------------
      anti-debug:
        enabled: false
        reaction: exit
        check-jdwp: true
        check-agents: true
        check-tools: true
        check-threads: true
        injection-chance: 20

      anti-tamper:
        enabled: false
        reaction: exit         # exit | throw
        injection-chance: 20   # keep low to avoid method-too-large

      anti-dump:
        enabled: false
        reaction: exit
        check-attach: true
        check-args: true
        check-agents: true
        check-props: true
        injection-chance: 29
#-------------------------------

      method-integrity:
        enabled: false

      string:
        poly:
          enabled: false
        poly2:
          enabled: false
        light:
          enabled: true

      string.stack:       # replaces every LDC "string" with a char-by-char StringBuilder sequence
        enabled: true
        min-length: 2
        max-length: 32     # keep low — each char = ~4 instructions
        xor-key: 0x5A        # set e.g. 0x5A to hide char values in bytecode to o

      ahegao:
        enabled: false

      string.split:
        enabled: true
        min-parts: 2            # split every string into at least 3 fragments
        max-parts: 4
        min-length: 6           # split even short strings
        chance: 70
#---------------------

      ref:
        enabled: false

      var-duplicate:
        enabled: true
        chance:    50    # 0-100 — % chance each XLOAD is redirected to the shadow
        min-vars:  1     # skip methods that store fewer than N distinct locals
        skip-init: true  # skip <init> and <clinit>

      mba:
        enabled: true
        depth: HIGH
        chance: 70

      flow:
        shuffle:
          enabled: true
        break:
          enabled: false
        traps:
          enabled: true
        flattening:
          enabled: true
        switch:
          enabled: true
        opaque:
          enabled: false

      numberobf:
        enabled: true

      dead-code:
        enabled: true
        injections-per-method: 4   # max dead blocks inserted per method
        chance: 85                 # % chance to inject at each eligible site

      virtualize:
        enabled: false
        chance: 75   # % of integer constants to virtualize (0-100)

      method-split:
        enabled: true
        min-insn: 30
        parts: 2
        chance: 100

      member-shuffle:
        enabled: true
        fields: true      # set false to skip field shuffling
        methods: true     # set false to skip method shuffling

      number:
        salt:
          enabled: true
          level: HiGH
          skipBsm: true
        table:
          enabled: true

      lift-constructors:
        enabled: false

      strip:
        enabled: true

      watermark:
        enabled: true

      array-rewriter:
        enabled: true
      indy-rewriter:
        enabled: true

      dot-graph:
        enabled: false

      exchange:
        enabled: true

      method-call-fix:
        enabled: false

      runtime-patch:
        enabled: false
  jnt:
    order:
      - cleanup
      - integrate
    transformers:
      cleanup:
        enabled: true
      integrate:
        enabled: true

    virtualize:
      enabled: false
      chance: 100

    intrinsic: false

    traceless: true
